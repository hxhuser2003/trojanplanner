kind = "web"
previewPath = "/"
title = "TrojanPlanner"
description = "A USC course-planning prototype with verified constraint solving, explicit conflict repair, and evidence-backed syllabus comparisons using synthetic demo data."
version = "1.0.0"
id = "artifacts/trojan-planner"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25650

[services.development]
run = "pnpm --filter @workspace/trojan-planner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trojan-planner", "run", "build" ]
serve = "static"
publicDir = "artifacts/trojan-planner/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25650"
BASE_PATH = "/"
